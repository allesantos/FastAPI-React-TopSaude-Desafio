services:
  # ==========================================
  # BANCO DE DADOS POSTGRESQL
  # ==========================================
  db:
    image: postgres:17.2-alpine
    container_name: topsaude_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-topsaude_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - topsaude_network
      - aiautomate
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ==========================================
  # BACKEND API (FastAPI) - PRODUÇÃO
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: topsaude_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-topsaude_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - topsaude_network
      - aiautomate
    labels:
      # Habilita o Traefik para este serviço
      - "traefik.enable=true"
      
      # Define a rede que o Traefik deve usar
      - "traefik.docker.network=aiautomate"
      
      # Configuração do roteador HTTP (redireciona para HTTPS)
      - "traefik.http.routers.topsaude-backend-http.rule=Host(`topsaude-api.alleart.com.br`)"
      - "traefik.http.routers.topsaude-backend-http.entrypoints=web"
      - "traefik.http.routers.topsaude-backend-http.middlewares=redirect-to-https"
      
      # Configuração do roteador HTTPS
      - "traefik.http.routers.topsaude-backend.rule=Host(`topsaude-api.alleart.com.br`)"
      - "traefik.http.routers.topsaude-backend.entrypoints=websecure"
      - "traefik.http.routers.topsaude-backend.tls=true"
      - "traefik.http.routers.topsaude-backend.tls.certresolver=letsencryptresolver"
      
      # Define a porta interna do container
      - "traefik.http.services.topsaude-backend.loadbalancer.server.port=8000"
      
      # Middleware para redirecionar HTTP para HTTPS
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    command: >
      sh -c "
        echo '⏳ Aguardando banco de dados...' &&
        sleep 5 &&
        echo '🔄 Aplicando migrações...' &&
        alembic upgrade head &&
        echo '✅ Migrações aplicadas!' &&
        echo '🚀 Iniciando servidor FastAPI em modo produção...' &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2
      "

  # ==========================================
  # FRONTEND - DESENVOLVIMENTO (Hot Reload)
  # ==========================================
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: topsaude_frontend_dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://backend:8000
      - VITE_APP_NAME=${VITE_APP_NAME:-TopSaúde Hub}
      - VITE_APP_VERSION=${VITE_APP_VERSION:-1.0.0-dev}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - topsaude_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    command: npm run dev -- --host 0.0.0.0
    profiles:
      - dev

  # ==========================================
  # FRONTEND - PRODUÇÃO (React + Vite + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
        - VITE_APP_NAME=${VITE_APP_NAME:-TopSaúde Hub}
        - VITE_APP_VERSION=${VITE_APP_VERSION:-1.0.0}
    container_name: topsaude_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - topsaude_network
      - aiautomate
    labels:
      # Habilita o Traefik para este serviço
      - "traefik.enable=true"
      
      # Define a rede que o Traefik deve usar
      - "traefik.docker.network=aiautomate"
      
      # Configuração do roteador HTTP (redireciona para HTTPS)
      - "traefik.http.routers.topsaude-frontend-http.rule=Host(`topsaude.alleart.com.br`)"
      - "traefik.http.routers.topsaude-frontend-http.entrypoints=web"
      - "traefik.http.routers.topsaude-frontend-http.middlewares=redirect-to-https"
      
      # Configuração do roteador HTTPS
      - "traefik.http.routers.topsaude-frontend.rule=Host(`topsaude.alleart.com.br`)"
      - "traefik.http.routers.topsaude-frontend.entrypoints=websecure"
      - "traefik.http.routers.topsaude-frontend.tls=true"
      - "traefik.http.routers.topsaude-frontend.tls.certresolver=letsencryptresolver"
      
      # Define a porta interna do container (Nginx)
      - "traefik.http.services.topsaude-frontend.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'
    profiles:
      - prod

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
    driver: local
    name: topsaude_postgres_data

# ==========================================
# NETWORKS
# ==========================================
networks:
  topsaude_network:
    driver: bridge
    name: topsaude_network
  
  # Conecta na rede existente do Traefik
  aiautomate:
    external: true